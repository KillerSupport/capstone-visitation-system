[platformio]
default_envs = esp32dev
src_dir = firmware/esp32e_as608
include_dir = firmware/esp32e_as608

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<esp32e_as608.ino>
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit Fingerprint Sensor Library
  links2004/WebSockets
  bblanchon/ArduinoJson@^7.0.0
